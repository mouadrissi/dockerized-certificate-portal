{% extends 'base.html' %}

{% block title %}Nouvelle Demande{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fa-solid fa-file-circle-plus me-2"></i>Nouvelle Demande d'Attestation</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.type_demande.label_tag }}
                        {{ form.type_demande }}
                    </div>
                    
                    <div class="mb-4">
                        {{ form.commentaire.label_tag }}
                        {{ form.commentaire }}
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary me-2">Annuler</a>
                        <button type="submit" class="btn btn-primary">Soumettre la demande</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
